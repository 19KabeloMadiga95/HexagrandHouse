name: Daily HexagrandHouse Cycles

on:
  workflow_dispatch:

  schedule:
    # Runs daily at 03:17 UTC
    # South Africa time = UTC+2, so this is 05:17 SAST
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  run-daily-cycles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lottery daily cycle
        run: |
          python -m src.lottery.automation.run_daily_lottery_cycle

      - name: Run football daily cycle
        run: |
          python -m src.football.automation.run_daily_football_cycle

      - name: Commit updated data outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/
          git add src/
          git add docs/
          git add README.md
          git add requirements.txt

          git diff --cached --quiet || git commit -m "Automated daily HexagrandHouse data refresh"

      - name: Push changes
        run: |
          git push