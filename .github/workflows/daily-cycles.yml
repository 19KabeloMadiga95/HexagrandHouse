name: Daily HexagrandHouse Cycles

on:
  schedule:
    # 04:19 AM UTC daily
    - cron: "19 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-cycles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lottery Daily Cycle
        run: |
          python -m src.lottery.automation.run_daily_lottery_cycle

      - name: Run Football Daily Cycle
        run: |
          python -m src.football.automation.run_daily_football_cycle

      - name: Build HexagrandHouse Database
        run: |
          python -m src.database.build_hexagrandhouse_db

      - name: Create cloud refresh marker
        run: |
          mkdir -p data
          date -u +"%Y-%m-%d %H:%M:%S UTC" > data/last_cloud_refresh.txt

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage deployment outputs
        run: |
          git add data/last_cloud_refresh.txt

          git add data/exports/final_predictions/*.xlsx || true
          git add data/football/exports/predictions/*.xlsx || true
          git add data/football/exports/backtesting/*.xlsx || true

      - name: Commit changes if needed
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "Automated daily prediction refresh"
          else
            echo "No deployment output changes to commit."
          fi

      - name: Pull latest changes
        run: |
          git pull --rebase origin main

      - name: Push changes
        run: |
          git push